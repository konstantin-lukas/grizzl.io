- heading "Create Timer" [level=1]
- text: Timer title*
- textbox "Timer title*"
- group:
  - button "Interval No. 1" [expanded]
  - region "Interval No. 1":
    - separator
    - text: Interval title
    - textbox "Interval title":
      - /placeholder: Displayed while interval is running
    - text: Interval type*
    - combobox "Interval type*": Standard
    - text: Repetitions*
    - group:
      - spinbutton "Repetitions*": "1"
      - button "Increment"
      - button "Decrement" [disabled]
    - text: Preparation Time*
    - group:
      - spinbutton "Preparation Time*": 0 sec
      - button "Increment"
      - button "Decrement" [disabled]
    - text: Duration*
    - group:
      - spinbutton "Duration*": 3 sec
      - button "Increment"
      - button "Decrement"
  - separator
  - button "Duplicate"
  - button "Move up" [disabled]
  - button "Move down" [disabled]
  - button "Delete" [disabled]
- button "Collapse all"
- button "Expand all"
- button "Create"